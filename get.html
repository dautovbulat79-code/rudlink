<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Скачать приложение | RUDLink</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f2e8">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
  .pg{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
  .pg__card{max-width:480px;width:100%;text-align:center;background:var(--card);border-radius:28px;box-shadow:var(--shadow-lg);padding:clamp(26px,5vw,40px)}
  .pg__bear{width:120px;height:120px;margin:0 auto 16px;border-radius:50%;object-fit:cover}
  .pg h1{font-size:clamp(26px,5vw,34px);margin-bottom:10px}
  .pg p{color:var(--muted)}
  .pg__btns{display:grid;gap:10px;margin-top:22px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<!-- Кнопка «1. Скачать приложение» из бота. Свои кнопки наверху, iPhone сразу уходит в App Store. Ссылки берутся из config.js. -->
<main class="pg">
  <div class="pg__card">
    <img class="pg__bear" src="bear.jpg" width="640" height="640" alt="">
    <h1 id="h">Скачайте приложение</h1>
    <p id="p">Выберите своё устройство. Потом вернитесь в бот и нажмите «Подключить».</p>
    <div class="pg__btns" id="btns">
      <a class="btn btn--ghost btn--lg" data-os="android" data-app="androidPlay" target="_blank" rel="noopener" href="#">Android — Google Play</a>
      <a class="btn btn--ghost btn--lg" data-os="android" data-app="android" href="#">Android — файл APK</a>
      <a class="btn btn--ghost btn--lg" data-os="ios" data-app="ios" target="_blank" rel="noopener" href="#">iPhone — App Store</a>
      <a class="btn btn--ghost btn--lg" data-os="mac" data-app="mac" target="_blank" rel="noopener" href="#">Mac — App Store</a>
      <a class="btn btn--ghost btn--lg" data-os="win" data-app="windows" href="#">Windows — скачать Happ</a>
    </div>
  </div>
</main>
<script>
(function () {
  var C = window.RUDLINK_CONFIG || {}, A = C.apps || {};
  var en = new URLSearchParams(location.search).get('lang') === 'en';
  var links = [].slice.call(document.querySelectorAll('#btns a'));
  links.forEach(function (a) { a.href = A[a.getAttribute('data-app')] || '#'; });
  if (en) {
    document.documentElement.lang = 'en';
    document.getElementById('h').textContent = 'Download the app';
    document.getElementById('p').textContent = 'Pick your device. Then go back to the bot and tap “Connect”.';
    links[1].textContent = 'Android — APK file';
    links[4].textContent = 'Windows — download Happ';
  }
  // Кнопки для вашего устройства — наверх и синим цветом.
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var os = ios ? 'ios' : /Android/.test(ua) ? 'android' : /Macintosh|Mac OS X/.test(ua) ? 'mac' : /Windows/.test(ua) ? 'win' : '';
  var box = document.getElementById('btns');
  links.filter(function (a) { return a.getAttribute('data-os') === os; }).reverse().forEach(function (a) {
    a.className = 'btn btn--primary btn--lg';
    box.insertBefore(a, box.firstChild);
  });
  if (ios && A.ios) location.replace(A.ios); // на iPhone вариант один — сразу в App Store
})();
</script>
</body>
</html>
